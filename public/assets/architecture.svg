<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">Proposed AWS Student Management Portal architecture</title><desc id="desc">Users to ALB to EC2 application instances in an Auto Scaling group, then a future backend to RDS and DynamoDB. CloudWatch monitors; CloudTrail audits; CodePipeline coordinates deployment; CloudFormation provisions infrastructure. Redshift analytics requires a separate data ingestion process. None of these services is connected to the static prototype.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#97ac9d"/></marker></defs>
